[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxent_insect_dir"
version = "0.1.0"
description = "MaxEnt species distribution modeling for invasive insect pests under climate change"
authors = [
  { name = "Pankaj Chouhan" },
  { name = "Olmo Zavala-Romero" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "elapid",
  "geopandas",
  "rasterio",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "joblib",
  "shapely",
  "typer",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mkdocs"]

[project.scripts]
maxent-insects = "maxent_insect_dir.run:main"

[tool.setuptools.packages.find]
include = ["maxent_insect_dir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 99

[tool.ruff]
line-length = 99
